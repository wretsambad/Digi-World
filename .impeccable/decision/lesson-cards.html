nt-size:14px;background:transparent;color:inherit;border:0;display:flex;align-items:center;gap:7px;padding:8px}.pause svg{width:13px;height:13px}.next{display:flex;align-items:center;justify-content:center;gap:16px;border:3px solid var(--ink);border-bottom-width:6px;background:var(--accent);color:var(--button-ink);border-radius:9px;padding:11px 18px;font-weight:650;min-width:140px;box-shadow:inset 0 2px 0 #ffffff60}.next svg{width:23px;height:23px;stroke-width:3}.key{font-size:11px;padding:2px 5px;border:1px solid currentColor;border-radius:3px;opacity:.75}.crest{position:absolute;top:-42px;left:24px;width:76px;height:76px;display:grid;place-items:center;border:4px solid var(--ink);border-radius:50%;color:var(--ink);background:var(--edge);box-shadow:inset 0 0 0 4px var(--paper),0 6px 14px #0b223b55}.crest svg{width:38px;height:38px;stroke-width:2.5;fill:none;stroke:currentColor}.bolts{position:absolute;inset:12px;pointer-events:none}.bolts i{position:absolute;width:7px;height:7px;background:var(--ink);border-radius:50%;opacity:.4}.bolts i:nth-child(1){left:0;top:0}.bolts i:nth-child(2){right:0;top:0}.bolts i:nth-child(3){left:0;bottom:0}.bolts i:nth-child(4){right:0;bottom:0}.story .lesson{padding-top:43px}.story .lesson:before{content:'';position:absolute;right:54px;top:-18px;width:31px;height:31px;border-top:4px solid var(--ink);border-left:4px solid var(--ink);transform:rotate(45deg);background:var(--paper)}.story .crest{transform:rotate(-9deg)}.notes .lesson{left:auto;right:38px;bottom:36px;width:400px;max-width:calc(100% - 320px);background:var(--deep);color:var(--light);border-radius:2px;border:0;padding:28px;clip-path:polygon(20px 0,100% 0,100% calc(100% - 20px),calc(100% - 20px) 100%,0 100%,0 20px);box-shadow:inset 0 0 0 2px var(--edge);}.notes .lesson:before{content:'';display:block;height:6px;background:var(--accent);width:64px;margin-bottom:20px}.notes .crest{position:relative;left:auto;top:auto;width:54px;height:54px;border-radius:0;border:1px solid var(--edge);box-shadow:none;background:transparent;color:var(--edge);margin-bottom:18px}.notes .crest svg{width:33px;height:33px}.notes .lesson h2{text-transform:uppercase;font-size:30px}.notes .lesson p{font-size:17px;color:var(--light)}.notes .lesson footer{flex-wrap:wrap;gap:14px;border-top:1px solid #ffffff45;padding-top:18px}.notes .step{width:100%;flex-shrink:0}.notes .next{margin-left:auto;border-radius:2px;border:0;box-shadow:none;min-width:120px;padding:11px 12px}.notes .bolts{display:none}.notes .key{display:none}.caption .lesson{left:auto;right:50px;bottom:36px;width:335px;max-width:calc(100% - 320px);padding:70px 25px 23px;border:5px solid var(--ink);border-radius:26px;background:linear-gradient(145deg,var(--paper),var(--paper));box-shadow:inset 0 0 0 5px var(--edge),0 16px 38px #05192a88;transform:rotate(2deg)}.caption .lesson:before{content:'';position:absolute;left:12px;right:12px;top:12px;height:56px;border-radius:12px 12px 40% 40%;background:var(--deep)}.caption .crest{top:-24px;left:calc(50% - 42px);width:84px;height:84px;transform:rotate(-2deg);border-radius:20px}.caption .crest svg{width:42px;height:42px}.caption .lesson h2{font-size:31px;text-align:center;margin:13px 0 15px}.caption .lesson p{font-size:17px;text-align:center}.caption .lesson footer{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:20px}.caption .step{margin:0;width:100%;text-align:center}.caption .next{width:100%;order:1}.caption .pause{order:2;padding-bottom:0}.caption .bolts{display:none}.caption .key{display:none}.entering{animation:arrive .38s cubic-bezier(.16,1,.3,1)}@keyframes arrive{from{opacity:0;translate:0 24px;scale:.96}to{opacity:1;translate:0 0;scale:1}}@media(prefers-reduced-motion:reduce){.entering{animation:none}}
@media(min-width:1500px){.lesson{left:calc(50% - 365px);right:auto;width:830px}.notes .lesson,.caption .lesson{left:auto;right:70px}}
@media(max-width:900px){.stage{min-height:850px}.brand{font-size:23px}.picker{width:210px;left:18px;padding:15px}.preview-tag{display:none}.chapter{left:auto;right:20px;transform:none}.lesson{left:252px;right:20px;padding:26px 22px 20px}.lesson h2{font-size:28px}.lesson p{font-size:17px}.lesson footer{gap:8px;flex-wrap:wrap}.step{width:100%}.next{margin-left:auto}.notes .lesson{max-width:calc(100% - 260px);right:20px}.caption .lesson{max-width:calc(100% - 260px);right:25px}}

<main id="stage" class="stage story"><img class="room" id="room" src="/.impeccable/review/outline-stage-3.png" alt="The backup robot outlined in yellow in Digi-World's bedroom">
<p class="brand">digi<span>·</span>world</p><div class="preview-tag">Game UI concept preview</div>
<div class="chapter"><span>Room discoveries</span><div class="pips" aria-label="Lesson 4 of 4"><i></i><i></i><i></i><i class="active"></i></div></div>
<aside class="picker"><h1>Choose your game UI</h1><div class="designs">
<button class="choice" data-design="story" aria-pressed="true"><strong>Quest Dialogue</strong><small>Chunky dialogue frame, skill emblem, and tactile controls.</small></button>
<button class="choice" data-design="notes" aria-pressed="false"><strong>Mission HUD</strong><small>Angular briefing panel with sharp edges and a bold objective.</small></button>
<button class="choice" data-design="caption" aria-pressed="false"><strong>Discovery Card</strong><small>A collectible-style card with a raised skill badge.</small></button></div>
<h2>Color scheme</h2><div id="palettes" class="palettes"></div><p id="palette-name" class="palette-name">Coral Quest</p>
<label class="scene-label" for="scene">Preview an object</label><select id="scene" aria-label="Preview an object"><option value="3">Backup robot</option><option value="0">Computer</option><option value="1">Sharing board</option><option value="2">Phone</option></select>
<button id="save" class="save">Save this look</button><p class="note">Preview only. The yellow object outline stays in every design.</p><p id="status" role="status"></p></aside>
<article class="lesson entering" id="lesson"><div class="crest" aria-hidden="true"><svg id="emblem" viewBox="0 0 48 48"><path d="M9 12h11l5 5h14v22H9zM24 23v10m-5-5 5 5 5-5"/></svg></div><div class="bolts" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div class="content"><h2 id="title">Give your files a backup</h2><p id="body">Discover how a backup can help you restore a project when something goes wrong.</p></div><footer><span class="step" id="step">4 / 4 · Backup robot</span><button class="pause" id="pause"><svg aria-hidden="true" viewBox="0 0 16 16" fill="currentColor"><path d="m3 2 10 6-10 6z"/></svg><span>Auto-play</span></button><button class="next" id="next"><span>Next</span><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m9 5 7 7-7 7"/></svg><span class="key">ENTER</span></button></footer></article>
</main><script>
const palettes=[{id:'warm',name:'Coral Quest',colors:['#fff3d4','#16364a','#ffad70'],deep:'#1c4c61',light:'#fff3d4',edge:'#ffd76e',buttonInk:'#16364a'},{id:'night',name:'Electric Blue',colors:['#e6f9ff','#102b50','#72f0e0'],deep:'#102b50',light:'#e6f9ff',edge:'#72f0e0',buttonInk:'#102b50'},{id:'grove',name:'Forest Adventure',colors:['#f1f8d7','#214837','#ffe27c'],deep:'#214837',light:'#f1f8d7',edge:'#b5e98d',buttonInk:'#214837'},{id:'orbit',name:'Cosmic Pop',colors:['#f7eaff','#422566','#ffc486'],deep:'#422566',light:'#f7eaff',edge:'#d7a0ff',buttonInk:'#422566'}];
const lessons=[['Build a stronger password','Explore what makes a password strong and how to keep your accounts safe.','Computer','M24 5 40 11v11c0 10-16 20-16 20S8 32 8 22V11zM18 22l5 5 9-10'],['Think before you share','Choose what is safe to post and which personal details to keep private.','Sharing board','M8 8h32v25H24l-10 8v-8H8zM16 18h16m-16 8h10'],['Spot a suspicious message','Look for warning signs in messages before trusting a link or replying.','Phone','M7 12h34v26H7zM7 13l17 13 17-13M24 30v3'],['Give your files a backup','Discover how a backup can help you restore a project when something goes wrong.','Backup robot','M9 12h11l5 5h14v22H9zM24 23v10m-5-5 5 5 5-5']];
const names={story:'Quest Dialogue',notes:'Mission HUD',caption:'Discovery Card'};let design='story',palette=palettes[0],lesson=3,paused=true;const $=id=>document.getElementById(id);
palettes.forEach(p=>{let b=document.createElement('button');b.className='palette';b.dataset.palette=p.id;b.setAttribute('aria-label',p.name);b.title=p.name;b.innerHTML=p.colors.map(c=>'<i aria-hidden="true" style="background:'+c+'"></i>').join('');b.onclick=()=>{palette=p;render()};$('palettes').append(b)});
document.querySelectorAll('[data-design]').forEach(b=>b.onclick=()=>{design=b.dataset.design;render()});
function entrance(){ $('lesson').classList.remove('entering');requestAnimationFrame(()=>requestAnimationFrame(()=>$('lesson').classList.add('entering'))) }
function render(){ $('stage').className='stage '+design;let vars={'paper':palette.colors[0],'ink':palette.colors[1],'accent':palette.colors[2],'deep':palette.deep,'light':palette.light,'edge':palette.edge,'button-ink':palette.buttonInk};Object.entries(vars).forEach(([k,v])=>$('stage').style.setProperty('--'+k,v));document.querySelectorAll('[data-design]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.design===design));document.querySelectorAll('[data-palette]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.palette===palette.id));$('palette-name').textContent=palette.name;$('status').textContent='';entrance() }
function setLesson(n){lesson=n;$('scene').value=n;$('room').src='/.impeccable/review/outline-stage-'+n+'.png';$('room').alt=lessons[n][2]+' outlined in yellow in Digi-World’s bedroom';$('title').textContent=lessons[n][0];$('body').textContent=lessons[n][1];$('step').textContent=(n+1)+' / 4 · '+lessons[n][2];$('emblem').innerHTML='<path d="'+lessons[n][3]+'"/>';document.querySelectorAll('.pips i').forEach((p,i)=>p.classList.toggle('active',i===n));document.querySelector('.pips').setAttribute('aria-label','Lesson '+(n+1)+' of 4');entrance()}
$('scene').onchange=e=>setLesson(Number(e.target.value));$('next').onclick=()=>setLesson((lesson+1)%4);$('pause').onclick=()=>{paused=!paused;$('pause').querySelector('span').textContent=paused?'Auto-play':'Pause';$('pause').querySelector('path').setAttribute('d',paused?'m3 2 10 6-10 6z':'M3 2h3v12H3zm7 0h3v12h-3z')};setInterval(()=>{if(!paused)setLesson((lesson+1)%4)},8000);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!["BUTTON","SELECT"].includes(document.activeElement.tagName)){setLesson((lesson+1)%4);e.preventDefault()}});
$('save').onclick=async()=>{let selection={version:2,design,designName:names[design],palette:palette.id,paletteName:palette.name};try{let response=await fetch('/selection',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(selection)});if(!response.ok)throw Error();$('status').textContent='Saved: '+selection.designName+' + '+selection.paletteName+'. Tell Codex to apply this look.'}catch{$('status').textContent='Send this choice in chat: '+selection.designName+' + '+selection.paletteName+'.'}};render();
</script></body></html>
